[project]
name = "cinepass-planner"
version = "0.1.0"
description = "Planificateur de journée cinéma pour abonnés Pathé CinéPass"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "allocine-seances>=0.0.14",
    "requests>=2.31.0",
    "pypdf>=5.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
cinepass = "cinepass_planner.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.hatch.build.targets.wheel]
packages = ["src/cinepass_planner"]
