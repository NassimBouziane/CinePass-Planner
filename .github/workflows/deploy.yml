name: Deploy & Sync to GitHub Pages

on:
  schedule:
    # Run every 2 hours on Tuesdays (when weekly cinema schedules are published in France)
    - cron: '0 */2 * * 2'
    # Run daily at 06:00 UTC for ratings refresh and schedule sync
    - cron: '0 6 * * *'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      sync_showtimes:
        description: 'Synchroniser les seances de cinema depuis Allocine'
        required: false
        default: true
        type: boolean
      full_sync:
        description: 'Synchroniser TOUS les cinemas par lots avec pause (si faux: 1 seul lot)'
        required: false
        default: true
        type: boolean
      refresh_ratings:
        description: 'Rafraichir les notes Allocine (presse et spectateurs)'
        required: false
        default: true
        type: boolean
      batch_pause:
        description: 'Pause en secondes entre chaque lot de 15 cinemas (defaut: 300s = 5min)'
        required: false
        default: '300'
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and push data commits
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore/Save SQLite database cache
        uses: actions/cache@v4
        with:
          path: data/cinepass.db
          key: cinepass-db-${{ github.run_id }}
          restore-keys: |
            cinepass-db-

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install web dependencies
        run: |
          cd web
          npm ci || npm install

      - name: Run web unit tests
        run: |
          cd web
          npm test

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Determine execution mode
        id: mode
        run: |
          IS_DATA_CHANGED="false"
          EXTRA_FLAGS=""

          if [ "${{ github.event_name }}" = "schedule" ]; then
            IS_DATA_CHANGED="true"
            EXTRA_FLAGS="--full-sync --batch-pause 300"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SYNC_SHOWTIMES="${{ github.event.inputs.sync_showtimes }}"
            FULL_SYNC="${{ github.event.inputs.full_sync }}"
            REFRESH_RATINGS="${{ github.event.inputs.refresh_ratings }}"
            BATCH_PAUSE="${{ github.event.inputs.batch_pause || '300' }}"

            if [ "$SYNC_SHOWTIMES" != "true" ]; then
              EXTRA_FLAGS="--skip-seed --skip-sync"
            else
              IS_DATA_CHANGED="true"
              if [ "$FULL_SYNC" = "true" ]; then
                EXTRA_FLAGS="--full-sync --batch-pause $BATCH_PAUSE"
              fi
            fi

            if [ "$REFRESH_RATINGS" = "false" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --skip-ratings"
            else
              IS_DATA_CHANGED="true"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            EXTRA_FLAGS="--skip-seed --skip-sync --skip-ratings"
          fi

          echo "is_sync=$IS_DATA_CHANGED" >> $GITHUB_OUTPUT
          echo "extra_flags=$EXTRA_FLAGS" >> $GITHUB_OUTPUT

      - name: Run pipeline (seed, sync, export & build site)
        run: |
          bash scripts/pipeline.sh --days 8 --build-web ${{ steps.mode.outputs.extra_flags }}
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          PYTHONUNBUFFERED: "1"

      - name: Commit and push updated JSON data to main (Sync only)
        if: steps.mode.outputs.is_sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "web/public/data" ] && [ -n "$(git status --porcelain web/public/data)" ]; then
            git add web/public/data
            git commit -m "chore(data): synchronisation automatique des seances et notes [skip ci]"
            git push origin main
          else
            echo "Aucune modification de donnees a committer."
          fi

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
