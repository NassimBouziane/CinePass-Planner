name: Sync & Deploy to GitHub Pages

on:
  schedule:
    # Run every 2 hours on Tuesdays (when weekly cinema schedules are published in France)
    - cron: '0 */2 * * 2'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore/Save SQLite database cache
        uses: actions/cache@v4
        with:
          path: data/cinepass.db
          key: cinepass-db-${{ github.run_id }}
          restore-keys: |
            cinepass-db-

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install web dependencies
        run: |
          cd web
          npm install

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Run pipeline (seed, sync, export & build site)
        run: bash scripts/pipeline.sh --days 8 --build-web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
